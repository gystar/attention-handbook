<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#637588"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans,sans-serif" fill="#243949">
<text x="190" y="40" text-anchor="middle" font-size="19">Shared prefix ends at P</text>
<rect x="40" y="75" width="300" height="290" rx="4" fill="#f4f6f8" stroke="#b7c3ce"/>
<text x="190" y="109" text-anchor="middle" font-size="19">Snapshot C(P)</text>
<rect x="65" y="130" width="250" height="38" rx="4" fill="#dce8f2" stroke="#b7c3ce"/>
<text x="190" y="155" text-anchor="middle" font-size="14">Global-layer KV</text>
<rect x="65" y="181" width="250" height="38" rx="4" fill="#f2e6d5" stroke="#b7c3ce"/>
