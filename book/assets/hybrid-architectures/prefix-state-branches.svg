<text x="565" y="124" text-anchor="middle" font-size="15">Restore C(P)</text>
<text x="565" y="151" text-anchor="middle" font-size="14">Private writes</text>
<path d="M640,135 L735,135" stroke="#637588" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="740" y="90" width="300" height="90" rx="4" fill="#eef3f7" stroke="#b7c3ce"/>
<text x="890" y="124" text-anchor="middle" font-size="17">Process branch suffix</text>
<text x="890" y="153" text-anchor="middle" font-size="15">Update all layer states</text>
<path d="M340,220 L485,315" stroke="#637588" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="565" y="255" text-anchor="middle" font-size="18">Branch B</text>
<rect x="490" y="270" width="150" height="90" rx="4" fill="#f4f6f8" stroke="#b7c3ce"/>
<text x="565" y="304" text-anchor="middle" font-size="15">Restore C(P)</text>
<text x="565" y="331" text-anchor="middle" font-size="14">Private writes</text>
<path d="M640,315 L735,315" stroke="#637588" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="740" y="270" width="300" height="90" rx="4" fill="#eef3f7" stroke="#b7c3ce"/>
<text x="890" y="304" text-anchor="middle" font-size="17">Process branch suffix</text>
<text x="890" y="333" text-anchor="middle" font-size="15">Update all layer states</text>
<text x="540" y="410" text-anchor="middle" font-size="15">Immutable KV prefixes may be shared; mutable state must be protected.</text>
<text x="540" y="438" text-anchor="middle" font-size="15">Snapshots align at the same processed position P across all layers.</text>
</g></svg>
