<text x="155.0" y="269" font-size="18" text-anchor="middle">Position cache K_R</text>
<text x="155.0" y="295" font-size="15" text-anchor="middle">N × d_r</text>
<rect x="360" y="80" width="240" height="85" rx="5" fill="#edf3f7" stroke="#aebfca"/>
<text x="480.0" y="109" font-size="18" text-anchor="middle">Content scores</text>
<text x="480.0" y="135" font-size="15" text-anchor="middle">q_hat Cᵀ : 1 × N</text>
