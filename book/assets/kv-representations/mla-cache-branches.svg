<text x="480.0" y="269" font-size="18" text-anchor="middle">Position scores</text>
<text x="480.0" y="295" font-size="15" text-anchor="middle">q_R K_Rᵀ : 1 × N</text>
<path d="M280 122L360 122" stroke="#607789" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M280 282L360 282" stroke="#607789" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="710" y="160" width="320" height="85" rx="5" fill="#edf3f7" stroke="#aebfca"/>
<text x="870.0" y="189" font-size="18" text-anchor="middle">Add → scale → mask → softmax</text>
<text x="870.0" y="215" font-size="15" text-anchor="middle">weights: 1 × N</text>
<path d="M600 122H650V202 M600 282H650V202H710" stroke="#607789" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="710" y="330" width="320" height="85" rx="5" fill="#edf3f7" stroke="#aebfca"/>
