<g font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" fill="#243949">
<text x="550" y="35" font-size="18" text-anchor="middle">One query head · one query position t · N cached positions</text>
<rect x="30" y="80" width="250" height="85" rx="5" fill="#eaf4ef" stroke="#aebfca"/>
<text x="155.0" y="109" font-size="18" text-anchor="middle">Content cache C</text>
<text x="155.0" y="135" font-size="15" text-anchor="middle">N × d_c</text>
