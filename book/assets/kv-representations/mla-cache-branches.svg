<path d="M870 245L870 330" stroke="#607789" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M155 165V205H315V373H710" stroke="#34836e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="550" y="451" font-size="16" text-anchor="middle">Cached elements per position: d_c + d_r. Softmax is applied once after adding both scores.</text>
