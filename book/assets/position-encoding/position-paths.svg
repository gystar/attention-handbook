<rect x="780" y="285" width="245" height="65" rx="4" fill="#f5f7f9" stroke="#cbd6df"/>
<text x="902" y="324" font-size="17" text-anchor="middle" fill="#253747">Softmax → AV</text>
<text x="25" y="375" font-size="16" text-anchor="start" fill="#253747">位置项分别作用于输入、Q/K 或匹配分数；图中省略残差、FFN 与其他网络组件。</text>
