<text x="450" y="490" font-size="17">Attention 机制用于按输入动态汇总信息，也可用于其他架构。</text>
<text x="450" y="521" font-size="16" fill="#475569">序列建模是需要表达顺序与上下文依赖的建模问题。</text>
