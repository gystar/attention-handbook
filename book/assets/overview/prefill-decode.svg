<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
  <title id="title">Prefill 与单步 Decode 的 Query 和 KV</title>
  <desc id="desc">五个 Prompt Token 的 Prefill 使用五行因果 Attention；最后一行预测第六个 Token。处理第六个 Token 时，只计算新的 Query，读取五个缓存 KV 和当前 KV，再预测第七个 Token。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #193047; }
      .title { font-size: 25px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 17px; fill: #526477; }
      .label { font-size: 18px; text-anchor: middle; }
      .cell { fill: #4e85be; stroke: white; stroke-width: 3; }
      .masked { fill: #e6ebf1; stroke: white; stroke-width: 3; }
      .current { fill: #22a78b; stroke: white; stroke-width: 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#71869b"/></marker>
  </defs>
  <rect width="1040" height="590" rx="16" fill="#f7f9fc"/>
  <rect x="20" y="20" width="480" height="491" rx="12" fill="white" stroke="#cdd7e2"/>
  <rect x="520" y="20" width="500" height="491" rx="12" fill="white" stroke="#cdd7e2"/>
  <text x="44" y="59" class="title">Prefill · 处理已知 Prompt</text>
  <text x="44" y="92" class="body">输入 x₁…x₅，各位置受 Causal Mask 约束</text>
  <text x="544" y="59" class="title">Decode · 处理一个新 Token</text>
  <text x="544" y="92" class="body">输入刚生成的 x₆，计算 q₆、k₆、v₆</text>
  <text x="126" y="134" class="label">k₁</text><text x="174" y="134" class="label">k₂</text><text x="222" y="134" class="label">k₃</text><text x="270" y="134" class="label">k₄</text><text x="318" y="134" class="label">k₅</text>
  <text x="76" y="177" class="label">q₁</text><text x="76" y="225" class="label">q₂</text><text x="76" y="273" class="label">q₃</text><text x="76" y="321" class="label">q₄</text><text x="76" y="369" class="label">q₅</text>
  <g>
    <rect x="102" y="147" width="48" height="48" class="cell"/><rect x="150" y="147" width="48" height="48" class="masked"/><rect x="198" y="147" width="48" height="48" class="masked"/><rect x="246" y="147" width="48" height="48" class="masked"/><rect x="294" y="147" width="48" height="48" class="masked"/>
    <rect x="102" y="195" width="48" height="48" class="cell"/><rect x="150" y="195" width="48" height="48" class="cell"/><rect x="198" y="195" width="48" height="48" class="masked"/><rect x="246" y="195" width="48" height="48" class="masked"/><rect x="294" y="195" width="48" height="48" class="masked"/>
    <rect x="102" y="243" width="48" height="48" class="cell"/><rect x="150" y="243" width="48" height="48" class="cell"/><rect x="198" y="243" width="48" height="48" class="cell"/><rect x="246" y="243" width="48" height="48" class="masked"/><rect x="294" y="243" width="48" height="48" class="masked"/>
    <rect x="102" y="291" width="48" height="48" class="cell"/><rect x="150" y="291" width="48" height="48" class="cell"/><rect x="198" y="291" width="48" height="48" class="cell"/><rect x="246" y="291" width="48" height="48" class="cell"/><rect x="294" y="291" width="48" height="48" class="masked"/>
    <rect x="102" y="339" width="48" height="48" class="cell"/><rect x="150" y="339" width="48" height="48" class="cell"/><rect x="198" y="339" width="48" height="48" class="cell"/><rect x="246" y="339" width="48" height="48" class="cell"/><rect x="294" y="339" width="48" height="48" class="cell"/>
  </g>
  <path d="M346 363 H374" stroke="#71869b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="382" y="369" class="body">预测 x₆</text>
  <text x="44" y="438" class="body">建立 KV Cache：(k₁,v₁)…(k₅,v₅)</text>
  <text x="44" y="479" class="small">每个 Query 对允许的 Key 归一化，再汇总 Value。</text>
  <text x="640" y="177" class="label">k₁</text><text x="694" y="177" class="label">k₂</text><text x="748" y="177" class="label">k₃</text><text x="802" y="177" class="label">k₄</text><text x="856" y="177" class="label">k₅</text><text x="910" y="177" class="label">k₆</text>
  <text x="580" y="222" class="label">q₆</text>
  <rect x="613" y="192" width="54" height="48" class="cell"/><rect x="667" y="192" width="54" height="48" class="cell"/><rect x="721" y="192" width="54" height="48" class="cell"/><rect x="775" y="192" width="54" height="48" class="cell"/><rect x="829" y="192" width="54" height="48" class="cell"/><rect x="883" y="192" width="54" height="48" class="current"/>
  <path d="M615 251 V262 H881 V251 M885 251 V262 H935 V251" fill="none" stroke="#71869b" stroke-width="2"/>
  <text x="748" y="291" class="label">此前缓存的 KV</text><text x="913" y="291" class="label">当前 KV</text>
  <path d="M775 310 V343" stroke="#71869b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775" y="375" text-anchor="middle" class="body">汇总 v₁…v₆ → 预测 x₇</text>
  <text x="544" y="438" class="body">向 Cache 追加 (k₆,v₆)</text>
  <text x="544" y="479" class="small">后续重复此步骤；历史 KV 无需重新投影。</text>
  <rect x="44" y="543" width="20" height="20" fill="#4e85be"/><text x="74" y="559" class="small">允许访问</text>
  <rect x="207" y="543" width="20" height="20" fill="#e6ebf1"/><text x="237" y="559" class="small">被 Mask</text>
  <rect x="368" y="543" width="20" height="20" fill="#22a78b"/><text x="398" y="559" class="small">当前 Token</text>
  <text x="618" y="559" class="small">单层、单 Head 示意；色块不表示权重大小。</text>
</svg>
