<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510">
<rect width="1080" height="510" fill="white"/>
<g font-family="DejaVu Sans,sans-serif" fill="#243949">
<text x="540" y="30" font-size="18" text-anchor="middle">One query · three keys · two-dimensional values</text>
<rect x="35" y="55" width="485" height="185" rx="6" fill="#edf3fa" stroke="#b4c3cc"/>
<text x="277" y="85" font-size="20" text-anchor="middle">Block A</text>
<text x="277" y="119" font-size="18" text-anchor="middle">scores: 0, log 2</text>
<text x="277" y="148" font-size="18" text-anchor="middle">values: (1, 0), (0, 1)</text>
<text x="277" y="177" font-size="18" text-anchor="middle">m_A = log 2</text>
<text x="277" y="206" font-size="18" text-anchor="middle">ℓ_A = 3/2     u_A = (1/2, 1)</text>
<rect x="560" y="55" width="485" height="185" rx="6" fill="#eaf4ef" stroke="#b4c3cc"/>
<text x="802" y="85" font-size="20" text-anchor="middle">Block B</text>
<text x="802" y="119" font-size="18" text-anchor="middle">score: log 6</text>
<text x="802" y="148" font-size="18" text-anchor="middle">value: (1, 1)</text>
<text x="802" y="177" font-size="18" text-anchor="middle">m_B = log 6</text>
<text x="802" y="206" font-size="18" text-anchor="middle">ℓ_B = 1     u_B = (1, 1)</text>
<text x="540" y="278" font-size="20" text-anchor="middle">Common scale: m = log 6</text>
<rect x="35" y="299" width="485" height="76" rx="6" fill="#edf3fa" stroke="#b4c3cc"/>
<rect x="560" y="299" width="485" height="76" rx="6" fill="#eaf4ef" stroke="#b4c3cc"/>
<text x="277" y="328" font-size="18" text-anchor="middle">α = exp(log 2 − log 6) = 1/3</text>
<text x="277" y="357" font-size="18" text-anchor="middle">αℓ_A = 1/2     αu_A = (1/6, 1/3)</text>
<text x="802" y="328" font-size="18" text-anchor="middle">β = exp(log 6 − log 6) = 1</text>
<text x="802" y="357" font-size="18" text-anchor="middle">βℓ_B = 1       βu_B = (1, 1)</text>
<text x="540" y="412" font-size="20" text-anchor="middle">Add:  ℓ = 3/2     u = (7/6, 4/3)</text>
<rect x="285" y="435" width="510" height="55" rx="6" fill="#f3f3f2" stroke="#b4c3cc"/>
<text x="540" y="470" font-size="20" text-anchor="middle">Normalize once:  o = u / ℓ = (7/9, 8/9)</text>
</g></svg>
